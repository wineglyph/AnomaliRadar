[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anomaliradar"
version = "0.2.0"
description = "State-aware, empirically calibrated anomaly detection on MetroPT-3"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "AnomaliRadar contributors" }]
keywords = [
    "anomaly-detection",
    "predictive-maintenance",
    "metropt-3",
    "calibration",
    "time-series",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
app = [
    "streamlit>=1.50,<2",
    "altair>=5.0",
    "pyarrow>=14.0",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
# pandas 2.3.3 + numpy 2.5.4 emits this on every Timedelta construction; it is
# an upstream compatibility warning, not a project warning.
filterwarnings = [
    "ignore:.*generic.*unit for NumPy timedelta is deprecated.*:DeprecationWarning",
]
